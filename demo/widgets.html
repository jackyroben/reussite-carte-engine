<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Test des widgets sur une autre origine · Grid32</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <main class="shell">
    <h1>Tester les iframes de Réussite Carte</h1>
    <p>Ces deux jeux sont hébergés par Réussite Carte et intégrés ici depuis GitHub Pages. <a href="https://reussite-carte.com/integrer/">Configurer votre iframe</a>.</p>
    <div class="frame-list">
      <section aria-labelledby="grid-title">
        <h2 id="grid-title">Réussite en grille</h2>
        <iframe id="widget-grid" src="https://reussite-carte.com/embed/32-cartes/" title="Réussite en grille à 32 cartes" height="720" loading="lazy" allow="fullscreen; clipboard-write; web-share" allowfullscreen></iframe>
      </section>
      <section aria-labelledby="klondike-title">
        <h2 id="klondike-title">Solitaire Klondike</h2>
        <iframe id="widget-klondike" src="https://reussite-carte.com/embed/solitaire/?theme=dark" title="Solitaire Klondike" height="720" loading="lazy" allow="fullscreen; clipboard-write; web-share" allowfullscreen></iframe>
      </section>
    </div>
    <nav aria-label="Ressources"><a href="./">Démonstration de Grid32</a><a href="https://reussite-carte.com/">Réussite Carte</a></nav>
  </main>
</body>
</html>
